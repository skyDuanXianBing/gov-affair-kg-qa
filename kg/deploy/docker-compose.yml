# OpenSPG 全家桶（基于官方 dev/release/docker-compose.yml 修改）
# 上游: https://github.com/OpenSPG/openspg/blob/master/dev/release/docker-compose.yml
# 本地修改:
#   1. 所有数据卷映射到 ./volumes/ 下（mysql / neo4j / minio 数据持久化，脱离 VM 可见可查）
#   2. 官方 neo4j 的 $HOME/dozerdb/logs:/logs 改为 ./volumes/neo4j/logs:/logs
#   3. JVM heap 保持官方值（server 8G / neo4j 4G），配合 colima VM 14G 内存
#   4. mysql 宿主机端口 3306→13306（3306 被本机 podman 的 mysql-container 占用）
services:
  server:
    restart: always
    image: spg-registry.cn-hangzhou.cr.aliyuncs.com/spg/openspg-server:latest
    container_name: release-openspg-server
    ports:
      - "8887:8887"
    depends_on:
      - mysql
      - neo4j
      - minio
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./volumes/server/logs:/home/admin/logs
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
    dns:
      # 2026-08-10 修复：Mac 睡眠唤醒后容器内 DNS 转发失效（127.0.0.11 无上游），
      # 导致服务端 LLM 校验/调用外网 API（api.deepseek.com）Connection error；显式指定公网 DNS。
      - 223.5.5.5
      - 114.114.114.114
    command: [
      "java",
      "-Dfile.encoding=UTF-8",
      "-Xms2048m",
      "-Xmx8192m",
      "-jar",
      "arks-sofaboot-0.0.1-SNAPSHOT-executable.jar",
      '--server.repository.impl.jdbc.host=mysql',
      '--server.repository.impl.jdbc.password=openspg',
      '--builder.model.execute.num=20',
      '--cloudext.graphstore.url=neo4j://release-openspg-neo4j:7687?user=neo4j&password=neo4j@openspg&database=neo4j',
      '--cloudext.searchengine.url=neo4j://release-openspg-neo4j:7687?user=neo4j&password=neo4j@openspg&database=neo4j'
    ]

  mysql:
    restart: always
    image: spg-registry.cn-hangzhou.cr.aliyuncs.com/spg/openspg-mysql:latest
    container_name: release-openspg-mysql
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./volumes/mysql/data:/var/lib/mysql
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      MYSQL_ROOT_PASSWORD: openspg
      MYSQL_DATABASE: openspg
    ports:
      # 宿主机 3306 被 podman 的 mysql-container 占用，改映射到 13306（容器间通信仍走 mysql:3306）
      - "13306:3306"
    command: [
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_general_ci'
    ]

  neo4j:
    restart: always
    image: spg-registry.cn-hangzhou.cr.aliyuncs.com/spg/openspg-neo4j:latest
    container_name: release-openspg-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - TZ=Asia/Shanghai
      - NEO4J_AUTH=neo4j/neo4j@openspg
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=4G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_dbms_security_procedures_unrestricted=*
      - NEO4J_dbms_security_procedures_allowlist=*
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./volumes/neo4j/data:/data
      - ./volumes/neo4j/logs:/logs

  minio:
    image: spg-registry.cn-hangzhou.cr.aliyuncs.com/spg/openspg-minio:latest
    container_name: release-openspg-minio
    command: server --console-address ":9001" /data
    restart: always
    environment:
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio@openspg
      TZ: Asia/Shanghai
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./volumes/minio/data:/data
